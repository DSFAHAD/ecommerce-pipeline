name: Data Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_pipeline

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 1. Get the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Create raw database schema
      - name: Create raw schema
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -f sql/raw-schema.sql

      # 5. Load sample data into raw
      - name: Load sample data into raw
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_pipeline
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python scripts/load-raw.py data/sample

      # 6. Create staging tables / transformations
      - name: Run staging transformations
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -f sql/staging-schema.sql

      # 6.5 Verify staging data
      - name: Verify staging data
        env:
          PGPASSWORD: postgres
        run: |
          echo "Checking staging.orders..."
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -c "SELECT COUNT(*) AS orders FROM staging.orders;"

          echo "Checking staging.order_items..."
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -c "SELECT COUNT(*) AS order_items FROM staging.order_items;"

      # 7. Create analytics tables / transformations
      - name: Run analytics transformations
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -f sql/analytical-schema.sql

      # 7.5 Verify analytics data
      - name: Verify analytics data
        env:
          PGPASSWORD: postgres
        run: |
          echo "Checking analytics.fact_order_items..."
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -c "SELECT COUNT(*) AS fact_order_items FROM analytics.fact_order_items;"

          echo "Checking analytics.dim_customers..."
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -c "SELECT COUNT(*) AS dim_customers FROM analytics.dim_customers;"

          echo "Checking analytics.dim_products..."
          psql \
            -h localhost \
            -U postgres \
            -d ecommerce_pipeline \
            -c "SELECT COUNT(*) AS dim_products FROM analytics.dim_products;"

      # 8. Run data quality checks
      - name: Run data quality checks
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_pipeline
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python tests/data-quality.py

      # 9. Stop containers
      - name: Stop containers
        if: always()
        run: |
          echo "PostgreSQL service will be stopped automatically by GitHub Actions."